
name: Build EasyDraw 7

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: Source ZIP not found"
            exit 1
          fi
          mkdir extracted
          unzip -q "$ZIP" -d extracted
          find extracted -maxdepth 4 -name settings.gradle -o -name settings.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false
          packages: ''

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-28" "build-tools;28.0.3"

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '5.4.1'

      - name: Find Android project
        id: project
        shell: bash
        run: |
          FILE=$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          if [ -z "$FILE" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi
          PROJECT=$(dirname "$FILE")
          echo "path=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Project found: $PROJECT"

      - name: Build APK and show errors
        shell: bash
        run: |
          cd "${{ steps.project.outputs.path }}"
          set +e
          gradle assembleDebug --console=plain > "$RUNNER_TEMP/build.log" 2>&1
          RESULT=$?
          if [ "$RESULT" -ne 0 ]; then
            echo "========== BUILD ERROR SUMMARY =========="
            grep -n -i -E -A 12 -B 4 \
              "What went wrong|FAILURE:|error:|Could not resolve|Execution failed|Could not find|Exception" \
              "$RUNNER_TEMP/build.log" | tail -n 100 || true
            echo "========== LAST 60 LOG LINES =========="
            tail -n 60 "$RUNNER_TEMP/build.log"
            exit "$RESULT"
          fi
          cat "$RUNNER_TEMP/build.log"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EasyDraw7-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
