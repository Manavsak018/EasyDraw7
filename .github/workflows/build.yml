
name: Build EasyDraw 7

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          test -n "$ZIP"
          mkdir extracted
          unzip -q "$ZIP" -d extracted
          ls -la extracted/EasyDraw7

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install required SDK
        run: |
          sdkmanager "platforms;android-28" "build-tools;28.0.3"

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '5.4.1'

      - name: Build APK
        run: |
          cd extracted/EasyDraw7
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EasyDraw7-APK
          path: extracted/EasyDraw7/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
