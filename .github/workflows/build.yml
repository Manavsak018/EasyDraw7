name: Build EasyDraw 7

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Find and extract source ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
          test -n "$ZIP"
          mkdir project
          unzip -q "$ZIP" -d project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '5.6.4'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-28" "build-tools;28.0.3"

      - name: Build APK
        run: |
          cd project/EasyDraw7
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: EasyDraw7-APK
          path: project/EasyDraw7/app/build/outputs/apk/debug/*.apk
          
